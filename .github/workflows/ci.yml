name: CI — Test & Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install test dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov httpx pydantic rank-bm25

      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=services --cov-report=xml --cov-report=term
        env:
          AZURE_OPENAI_API_KEY: "test-key"
          AZURE_OPENAI_ENDPOINT: "https://test.openai.azure.com/"
          AZURE_OPENAI_API_VERSION: "2024-02-01"
          AZURE_OPENAI_DEPLOYMENT_CHAT: "devlab-gpt-4o-mini"
          AZURE_OPENAI_DEPLOYMENT_MINI: "devlab-gpt-4o-mini"
          AZURE_OPENAI_DEPLOYMENT_EMBEDDINGS: "devlab-text-embedding-3-large"
          NEO4J_USER: "neo4j"
          NEO4J_PASSWORD: "test"
          JWT_SECRET_KEY: "test-secret-key-for-ci"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./coverage.xml

  build-ingestion:
    name: Build ingestion-service
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t omni-analyst/ingestion-service:${{ github.sha }} ./services/ingestion-service

  build-chat:
    name: Build chat-service
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t omni-analyst/chat-service:${{ github.sha }} ./services/chat-service

  build-user:
    name: Build user-service
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t omni-analyst/user-service:${{ github.sha }} ./services/user-service

  build-evaluation:
    name: Build evaluation-service
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t omni-analyst/evaluation-service:${{ github.sha }} ./services/evaluation-service
